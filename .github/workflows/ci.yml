name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8

    - name: Lint code with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=chroma_db,.venv,venv,env
        # Treat style warnings as non-fatal
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=chroma_db,.venv,venv,env

    - name: Verify module imports and LangGraph graph compilation
      env:
        GROQ_API_KEY: "test_groq_api_key"
      run: |
        python -c "import app, ingest, graph, tts, stt, rag, evaluator; print('✓ Core modules loaded successfully')"
        python -c "from graph import graph; print('✓ LangGraph graph compiled successfully')"

    - name: Run automated tests
      env:
        GROQ_API_KEY: "test_groq_api_key"
      run: |
        pytest -v
